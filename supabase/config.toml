project_id = "itsmart"

# These browser-called functions authenticate the caller inside the handler.
# Keeping gateway JWT verification off also lets unauthenticated CORS
# preflight (OPTIONS) requests reach the handlers.
[functions.create-user]
verify_jwt = false

[functions.reset-password]
verify_jwt = false

# Authenticates the caller inside the handler; preflight must reach it.
[functions.change-password]
verify_jwt = false

# Browsers send CSP violation reports without credentials. The handler accepts
# only POST bodies of the expected types and size, and writes only sanitized
# fields with the service role.
[functions.csp-report]
verify_jwt = false
