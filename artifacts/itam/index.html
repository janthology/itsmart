<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>ITSMART — IT Asset & Support Management</title>
    <meta
      name="description"
      content="ITSMART is the IT asset and support management system of DOST Cagayan Valley — track equipment, resolve support tickets, and generate reports."
    />
    <meta name="theme-color" content="#355872" />

    <!-- Icons & install identity (DOST logo on the brand-blue tile) -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Social / sharing preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ITSMART — IT Asset & Support Management" />
    <meta
      property="og:description"
      content="IT asset and support management for DOST Cagayan Valley."
    />
    <meta property="og:image" content="/opengraph.jpg" />

    <!-- App fonts: Outfit (display) + DM Sans (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    >
  </head>
  <body>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("itsmart-theme");
          if (
            theme === "dark" ||
            (theme !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches)
          ) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
